<main class="container">
  <header class="app-head"><h1>◔ BudgetSplit</h1><div class="settings"><select class="select" id="language" aria-label="Language"><option value="zh-TW">繁體中文</option><option value="en">English</option></select><select class="select" id="currency" aria-label="Currency"><option value="TWD">TWD · NT$</option><option value="USD">USD · $</option><option value="JPY">JPY · ¥</option><option value="EUR">EUR · €</option><option value="GBP">GBP · £</option><option value="CAD">CAD · C$</option><option value="AUD">AUD · A$</option><option value="KRW">KRW · ₩</option><option value="SGD">SGD · S$</option></select></div></header>
  <section class="top-bar"><div class="income-bar"><label id="incomeLabel" for="income"></label><span class="currency-symbol" id="currencySymbol">NT$</span><input type="number" id="income" value="50000" step="1000" min="0" inputmode="decimal" placeholder="0"></div><div class="io-btns"><button class="btn primary" id="exportBtn" data-i18n="exportCsv"></button><button class="btn" id="importBtn" data-i18n="importCsv"></button><button class="btn" id="snapshotBtn" data-i18n="snapshot"></button><input type="file" id="fileInput" accept=".csv,text/csv"></div></section>
  <section class="template-bar"><label for="templateSelect" data-i18n="starterTemplate"></label><select class="select" id="templateSelect"></select><button class="btn primary" id="applyTemplateBtn" data-i18n="apply"></button></section>
  <section class="payroll" id="payrollPanel" hidden><div class="payroll-head"><div><div class="payroll-title" data-i18n="payrollTitle"></div><div class="payroll-note" data-i18n="payrollNote"></div></div><button class="btn small" id="closePayrollBtn" data-i18n="disable"></button></div><div class="payroll-grid"><div class="field"><label for="grossIncome" data-i18n="grossSalary"></label><input id="grossIncome" type="number" min="0" step="1000" inputmode="decimal"></div><div class="field"><label for="pensionRate" data-i18n="pensionRate"></label><div class="pension-control"><input id="pensionSlider" type="range" min="0" max="6" step="1"><input id="pensionRate" type="number" min="0" max="6" step="1" inputmode="numeric"></div></div><div class="deduction-pills"><div class="pill"><span data-i18n="laborInsurance"></span><strong id="laborValue"></strong></div><div class="pill"><span data-i18n="healthInsurance"></span><strong id="healthValue"></strong></div><div class="pill"><span data-i18n="monthlyTax"></span><strong id="taxValue"></strong></div><div class="pill"><span data-i18n="pensionSelf"></span><strong id="pensionValue"></strong></div></div></div></section>
  <section class="slots-wrap"><div class="slots-label"><span><span data-i18n="budgetSlots"></span> · <span class="save-indicator" id="saveIndicator" data-i18n="saved"></span></span><span class="slot-nav"><button class="icon-btn" id="prevSlots" aria-label="Previous">‹</button><span class="page-label" id="slotPageLabel"></span><button class="icon-btn" id="nextSlots" aria-label="Next">›</button></span></div><div class="slots" id="slots"></div></section>

  <div class="legend" id="legend"></div><section id="cats"></section>
</main><div class="toast" id="toast" role="status"></div>

function parseMoney(value){const parsed=Number(String(value??'').replace(/[^0-9.-]/g,''));return Number.isFinite(parsed)?parsed:0}
function legacyCatId(label){const key=String(label||'').trim().toLowerCase().replace(/\s+/g,'').replace(/／/g,'/');return({'必要支出':'n','想要支出':'w','儲蓄與投資':'s','儲蓄/投資':'s','needs':'n','wants':'w','savings':'s','savings/investing':'s','savings&investing':'s'})[key]||null}
function parseV2Budget(rows){const incoming=makeCats();let newIncome=50000,newPayroll=defaultPayroll(),currency=settings.currency;rows.forEach(row=>{if(row[0]==='currency')currency=row[1]||currency;if(row[0]==='income')newIncome=parseMoney(row[1])||newIncome;if(row[0]==='payroll'){try{newPayroll={...defaultPayroll(),...JSON.parse(row[1])}}catch(e){}}const id=row[5];if(!CAT_STYLE[id])return;const cat=incoming.find(c=>c.id===id);if(row[1]!==''&&Number.isFinite(Number(row[1])))cat.pct=clamp(row[1],0,100);if(row[2]!=='')cat.locked=row[2]==='1';if(row[3]!==''||row[4]!=='')cat.items.push({title:String(row[3]||''),amount:parseMoney(row[4]),...(row[6]?{systemKey:row[6]}:{})})});return{cats:incoming,income:newIncome,payroll:newPayroll,currency,legacy:false}}
function parseLegacyBudget(rows){const incoming=makeCats(),incomeKeys=['月收入','每月收入','monthly income','income'],skipItems=['說明','項目','總支出','結餘','剩餘','description','item','total expenses','remaining'];let newIncome=0,lastId=null,recognized=0;rows.forEach(row=>{const first=String(row[0]||'').trim(),fourth=String(row[3]||'').trim(),lowerFirst=first.toLowerCase(),lowerFourth=fourth.toLowerCase();if(incomeKeys.includes(lowerFirst)||incomeKeys.includes(first)){newIncome=parseMoney(row[1]);return}const mapped=legacyCatId(first);if(mapped){lastId=mapped;recognized++;const cat=incoming.find(c=>c.id===mapped);if(row[1]!==''&&Number.isFinite(Number(row[1])))cat.pct=clamp(row[1],0,100)}if(first==='[摘要]'||lowerFirst==='[summary]'||skipItems.includes(lowerFourth)||skipItems.includes(fourth))return;if(lastId&&row.length>=5&&(fourth!==''||row[4]!=='')){incoming.find(c=>c.id===lastId).items.push({title:fourth,amount:parseMoney(row[4])})}});if(!recognized)throw new Error('unrecognized legacy CSV');return{cats:incoming,income:newIncome||50000,payroll:defaultPayroll(),currency:'TWD',legacy:true}}
function parseImportedBudget(rows){return rows[0]?.[0]==='BudgetSplit'?parseV2Budget(rows):parseLegacyBudget(rows)}
function importCSV(file){const reader=new FileReader();reader.onload=event=>{try{const text=String(event.target.result||'').replace(/^\uFEFF/,''),rows=text.split(/\r?\n/).map(parseCSVLine),data=parseImportedBudget(rows);settings.currency=data.currency;saveSettings();CATS=data.cats;payroll=data.payroll;document.getElementById('income').value=data.income;slots[activeSlot].name=file.name.replace(/\.csv$/i,'').replace(/_\d{8}$/,'').trim()||slots[activeSlot].name;applyTranslations();renderPayroll();render();renderSlots();showToast(data.legacy?(settings.locale==='zh-TW'?'舊版 CSV 已轉換並匯入':'Legacy CSV converted and imported'):t('imported'))}catch(err){showToast(t('importFailed'))}document.getElementById('fileInput').value=''};reader.readAsText(file,'UTF-8')}
function fileName(ext){const date=new Date(),stamp=`${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}`,name=(slots[activeSlot].name||'BudgetSplit').replace(/[\\/:*?"<>|]/g,'_');return`${name}_${stamp}.${ext}`}function downloadBlob(data,type,name){const blob=data instanceof Blob?data:new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function exportSnapshot(){const width=700,pad=42,rowH=28,items=CATS.reduce((n,c)=>n+Math.max(1,c.items.length),0),height=245+items*rowH+CATS.length*62,scale=2,canvas=document.createElement('canvas');canvas.width=width*scale;canvas.height=height*scale;const ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.textBaseline='middle';let y=45;ctx.fillStyle='#111';ctx.font='700 24px system-ui';ctx.fillText(slots[activeSlot].name||'BudgetSplit',pad,y);ctx.textAlign='right';ctx.font='13px system-ui';ctx.fillStyle='#888';ctx.fillText(new Date().toLocaleDateString(settings.locale),width-pad,y);ctx.textAlign='left';y+=40;ctx.font='14px system-ui';ctx.fillStyle='#666';ctx.fillText(t('monthlyIncome'),pad,y);ctx.textAlign='right';ctx.font='700 19px system-ui';ctx.fillStyle='#111';ctx.fillText(fmt(income()),width-pad,y);ctx.textAlign='left';y+=35;let x=pad,barWidth=width-pad*2;CATS.forEach(cat=>{ctx.fillStyle=CAT_STYLE[cat.id].color;const w=barWidth*cat.pct/100;ctx.fillRect(x,y,w,14);x+=w});y+=45;CATS.forEach(cat=>{ctx.fillStyle=CAT_STYLE[cat.id].color;ctx.beginPath();ctx.arc(pad+5,y,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.font='700 15px system-ui';ctx.fillText(`${catLabel(cat.id)}  ${cat.pct}%`,pad+18,y);ctx.textAlign='right';ctx.font='12px system-ui';ctx.fillStyle='#666';ctx.fillText(`${t('budget')} ${fmt(catBudget(cat))}`,width-pad,y);ctx.textAlign='left';y+=28;const list=cat.items.length?cat.items:[{title:t('noItems'),amount:''}];list.forEach(entry=>{ctx.fillStyle=entry.amount===''?'#aaa':'#444';ctx.font='13px system-ui';ctx.fillText(entry.title||t('itemPlaceholder'),pad+18,y);if(entry.amount!==''){ctx.textAlign='right';ctx.fillStyle='#222';ctx.fillText(fmt(entry.amount),width-pad,y);ctx.textAlign='left'}y+=rowH});y+=18;ctx.strokeStyle='#eee';ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(width-pad,y);ctx.stroke();y+=25});const total=CATS.reduce((sum,c)=>sum+catSpent(c),0);ctx.font='700 15px system-ui';ctx.fillStyle='#555';ctx.fillText(t('totalExpenses'),pad,y);ctx.textAlign='right';ctx.fillStyle='#111';ctx.fillText(fmt(total),width-pad,y);y+=30;ctx.textAlign='left';ctx.fillStyle='#555';ctx.fillText(t('remaining'),pad,y);ctx.textAlign='right';ctx.fillStyle=income()-total<0?'#d04543':'#1d9e75';ctx.font='700 18px system-ui';ctx.fillText(fmt(income()-total),width-pad,y);canvas.toBlob(blob=>{downloadBlob(blob,'image/png',fileName('png'));showToast(t('snapshotDone'))},'image/png')}
document.getElementById('language').addEventListener('change',e=>{settings.locale=e.target.value;saveSettings();localizeItems();applyTranslations();renderPayroll();render();renderSlots()});document.getElementById('currency').addEventListener('change',e=>{settings.currency=e.target.value;saveSettings();applyTranslations();renderPayroll();render();showToast(t('currencyNoConvert'))});document.getElementById('income').addEventListener('input',e=>{if(payroll.enabled){payroll.gross=Number(e.target.value)||0;syncPayrollItems();renderPayroll();render()}else updateSummary()});document.getElementById('grossIncome').addEventListener('input',e=>{payroll.gross=Math.max(0,Number(e.target.value)||0);document.getElementById('income').value=payroll.gross;syncPayrollItems();renderPayroll();render()});function setPensionRate(value){payroll.pensionRate=clamp(value,0,6);document.getElementById('pensionSlider').value=payroll.pensionRate;document.getElementById('pensionRate').value=payroll.pensionRate;syncPayrollItems();renderPayroll();render()}document.getElementById('pensionSlider').addEventListener('input',e=>setPensionRate(e.target.value));document.getElementById('pensionRate').addEventListener('input',e=>setPensionRate(e.target.value));document.getElementById('closePayrollBtn').addEventListener('click',()=>{payroll.enabled=false;applyTranslations();renderPayroll();scheduleSave()});document.getElementById('applyTemplateBtn').addEventListener('click',applyTemplate);document.getElementById('prevSlots').addEventListener('click',()=>{if(slotPage>0){slotPage--;renderSlots()}});document.getElementById('nextSlots').addEventListener('click',()=>{if(slotPage<Math.ceil(SLOT_COUNT/SLOT_PAGE_SIZE)-1){slotPage++;renderSlots()}});document.getElementById('normalizeBtn').addEventListener('click',normalizePcts);document.getElementById('exportBtn').addEventListener('click',exportCSV);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('fileInput').click());document.getElementById('fileInput').addEventListener('change',e=>{if(e.target.files[0])importCSV(e.target.files[0])});document.getElementById('snapshotBtn').addEventListener('click',exportSnapshot);window.addEventListener('beforeunload',()=>saveNow(false));hydrateSlot(activeSlot);if(migrationState.upgraded)setTimeout(()=>showToast(settings.locale==='zh-TW'?`已升級 ${migrationState.upgraded} 個舊版預算，原始備份已保留`:`Upgraded ${migrationState.upgraded} legacy budgets; backup preserved`),0);
</script>
