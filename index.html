<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BudgetSplit</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f3;color:#1a1a1a;font-size:14px}
.container{max-width:700px;margin:0 auto;padding:1.25rem}
h1{font-size:17px;font-weight:600;margin-bottom:1rem;color:#111}
.top-bar{display:flex;align-items:center;gap:8px;margin-bottom:.75rem;flex-wrap:wrap}
.income-bar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e0e0dc;border-radius:10px;padding:.65rem 1rem;flex:1;min-width:200px}
.income-bar label{font-size:13px;color:#666;white-space:nowrap}
.income-bar .currency{font-size:17px;font-weight:600;color:#aaa}
.income-bar input{flex:1;border:none;font-size:17px;font-weight:600;color:#111;outline:none;background:transparent;min-width:0}
.io-btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid #e0e0dc;background:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;color:#444;white-space:nowrap}
.btn:hover{background:#f5f5f3;border-color:#bbb}
.btn.primary{background:#378ADD;color:#fff;border-color:#378ADD}
.btn.primary:hover{background:#2d6fb5}

.slots-label{font-size:11px;color:#999;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.save-indicator{font-size:11px;color:#3B6D11;opacity:0;transition:opacity .4s}
.save-indicator.show{opacity:1}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.slot{background:#fff;border:1px solid #e0e0dc;border-radius:10px;padding:.65rem .8rem;cursor:pointer;transition:border-color .2s,background .2s;position:relative}
.slot:hover{border-color:#aaa}
.slot.active{border:2px solid #378ADD;background:#f0f7ff}
.slot-name-input{width:100%;border:none;font-size:13px;font-weight:600;color:#111;background:transparent;outline:none;cursor:pointer;padding:0;margin-bottom:3px}
.slot.active .slot-name-input{cursor:text}
.slot-meta{font-size:10px;color:#bbb}
.slot-actions{display:flex;gap:4px;margin-top:6px}
.slot-btn{border:1px solid #e8e8e5;background:none;border-radius:6px;padding:2px 7px;font-size:10px;color:#888;cursor:pointer}
.slot-btn:hover{background:#f5f5f3;color:#333}
.slot-btn.danger:hover{background:#fef0f0;color:#e24b4a;border-color:#f5c4c4}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.sum-card{background:#fff;border:1px solid #e0e0dc;border-radius:10px;padding:.65rem 1rem}
.sum-card .lbl{font-size:11px;color:#999;margin-bottom:2px}
.sum-card .val{font-size:17px;font-weight:600}
.sum-card .sub{font-size:11px;color:#aaa;margin-top:1px}
.stacked-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-bottom:.5rem;border:1px solid #e0e0dc}
.seg{transition:width .3s}
.legend{display:flex;gap:14px;margin-bottom:1rem;font-size:12px;color:#666;flex-wrap:wrap}
.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}
.cat-card{background:#fff;border:1px solid #e0e0dc;border-radius:12px;padding:1rem;margin-bottom:.75rem}
.cat-head{display:flex;align-items:center;gap:8px;margin-bottom:.4rem}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cat-name{font-size:14px;font-weight:600;flex:1}
.pct-badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;color:#fff}
.cat-sub{font-size:11px;color:#aaa;margin-bottom:.6rem}
.slider-wrap{display:flex;align-items:center;gap:10px;margin-bottom:.65rem}
.slider-wrap input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;outline:none;cursor:pointer}
.slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ac);cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--ac)}
.slider-wrap input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ac);cursor:pointer;box-shadow:0 0 0 1px var(--ac);border:none}
.pct-num{width:44px;text-align:right;font-size:13px;font-weight:500;color:#555}
.budget-row{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:.5rem}
.progress-bg{height:5px;background:#f0efed;border-radius:3px;margin-bottom:.75rem;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}
.items{display:flex;flex-direction:column;gap:5px;margin-bottom:.5rem}
.item-row{display:flex;gap:6px;align-items:center}
.drag-handle{cursor:grab;color:#cfcfcc;font-size:15px;line-height:1;padding:0 2px;flex-shrink:0;user-select:none;touch-action:none}
.drag-handle:hover{color:#888}
.drag-handle:active{cursor:grabbing}
.item-row input[type=text]{flex:1;border:1px solid #e0e0dc;border-radius:7px;padding:5px 8px;font-size:12px;outline:none;background:#fafafa;color:#111}
.item-row input[type=text]:focus{border-color:#aaa;background:#fff}
.item-row input[type=number]{width:96px;border:1px solid #e0e0dc;border-radius:7px;padding:5px 8px;font-size:12px;outline:none;background:#fafafa;color:#111;text-align:right}
.item-row input[type=number]:focus{border-color:#aaa;background:#fff}
.del-btn{width:24px;height:24px;border:none;background:none;cursor:pointer;color:#ccc;font-size:14px;display:flex;align-items:center;justify-content:center;border-radius:5px;flex-shrink:0}
.del-btn:hover{color:#e24b4a;background:#fef0f0}
.sortable-ghost{opacity:.35}
.sortable-chosen{background:#f0f7ff;border-radius:7px}
.sortable-drag{opacity:.9}
.add-btn{border:1px dashed #ddd;background:none;border-radius:7px;padding:5px 10px;font-size:12px;color:#aaa;cursor:pointer;width:100%;text-align:left}
.add-btn:hover{background:#fafafa;color:#555;border-color:#aaa}
.warn{font-size:11px;color:#e24b4a;margin-bottom:.5rem;padding:6px 10px;background:#fef0f0;border-radius:7px;display:none;align-items:center;gap:8px}
.warn-fix{border:1px solid #e8a0a0;background:#fff;color:#c0392b;border-radius:6px;padding:2px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.warn-fix:hover{background:#c0392b;color:#fff;border-color:#c0392b}
.over-tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:#fef0f0;color:#e24b4a}
.ok-tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:#eaf3de;color:#3B6D11}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#222;color:#fff;font-size:13px;padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="container">
  <h1>💰 BudgetSplit</h1>

  <div class="top-bar">
    <div class="income-bar">
      <label>月收入</label>
      <span class="currency">NT$</span>
      <input type="number" id="income" value="50000" step="1000" min="0" placeholder="0">
    </div>
    <div class="io-btns">
      <button class="btn primary" id="exportBtn">⬇ 匯出 CSV</button>
      <button class="btn" id="importBtn">⬆ 匯入 CSV</button>
      <button class="btn" id="snapshotBtn">📸 快照</button>
      <input type="file" id="fileInput" accept=".csv">
    </div>
  </div>

  <div class="slots-label">
    <span>存檔欄位</span>
    <span class="save-indicator" id="saveIndicator">✓ 資料已保存至本地</span>
  </div>
  <div class="slots" id="slots"></div>

  <div id="warn" class="warn" style="display:none">⚠️ 比例總和目前為 <span id="warn-val"></span>%，請調整至 100% <button class="warn-fix" id="normalizeBtn">一鍵歸位</button></div>

  <div class="summary">
    <div class="sum-card"><div class="lbl">月收入</div><div class="val" id="s-inc">NT$50,000</div></div>
    <div class="sum-card"><div class="lbl">總支出</div><div class="val" id="s-spend">NT$0</div></div>
    <div class="sum-card"><div class="lbl">結餘</div><div class="val" id="s-left">NT$50,000</div><div class="sub" id="s-left-sub">100%</div></div>
  </div>

  <div class="stacked-bar">
    <div class="seg" id="bar-n" style="width:50%;background:#378ADD"></div>
    <div class="seg" id="bar-w" style="width:30%;background:#1D9E75"></div>
    <div class="seg" id="bar-s" style="width:20%;background:#D85A30"></div>
  </div>
  <div class="legend">
    <span><span class="legend-dot" style="background:#378ADD"></span>必要支出 Needs</span>
    <span><span class="legend-dot" style="background:#1D9E75"></span>想要支出 Wants</span>
    <span><span class="legend-dot" style="background:#D85A30"></span>儲蓄/投資 Savings</span>
  </div>

  <div id="cats"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script>
const CAT_DEFS=[
  {id:'n',label:'必要支出',sub:'Needs — 房租・伙食・水電・交通・保險',color:'#378ADD'},
  {id:'w',label:'想要支出',sub:'Wants — 聚餐・娛樂・購物・旅遊',color:'#1D9E75'},
  {id:'s',label:'儲蓄與投資',sub:'Savings — 緊急預備金・股票・退休金',color:'#D85A30'}
];
const SLOT_COUNT=3;
const LS_KEY='budgetsplit_slots';
const LS_ACTIVE='budgetsplit_active';

let CATS=makeCats();
let activeSlot=0;
let slots=loadSlots();
let saveTimer=null;
let lastAdjustedCI=null;
let sortables=[];

function makeCats(){
  return CAT_DEFS.map(d=>({...d,pct:d.id==='n'?50:d.id==='w'?30:20,items:[]}));
}
function defaultSlot(i){
  return {name:`存檔 ${i+1}`,savedAt:null,income:50000,cats:makeCats()};
}
function loadSlots(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){
      const arr=JSON.parse(raw);
      while(arr.length<SLOT_COUNT) arr.push(defaultSlot(arr.length));
      return arr.slice(0,SLOT_COUNT);
    }
  }catch(e){}
  return Array.from({length:SLOT_COUNT},(_,i)=>defaultSlot(i));
}
function saveSlots(){
  slots[activeSlot].income=income();
  slots[activeSlot].cats=JSON.parse(JSON.stringify(CATS));
  slots[activeSlot].savedAt=new Date().toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  try{localStorage.setItem(LS_KEY,JSON.stringify(slots));}catch(e){}
  localStorage.setItem(LS_ACTIVE,activeSlot);
  showSaveIndicator();
  renderSlots();
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveSlots,800);
}
function showSaveIndicator(){
  const el=document.getElementById('saveIndicator');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}
function loadSlot(i){
  // 切換前先把當前存檔待儲存的資料寫入，避免 debounce 未觸發造成遺失
  if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; saveSlots(); }
  activeSlot=i;
  const s=slots[i];
  document.getElementById('income').value=s.income||50000;
  CATS=JSON.parse(JSON.stringify(s.cats||makeCats()));
  lastAdjustedCI=null;
  localStorage.setItem(LS_ACTIVE,i);
  renderSlots();
  render();
}

/* ── SLOTS UI ── */
function renderSlots(){
  const el=document.getElementById('slots');
  el.innerHTML='';
  slots.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='slot'+(i===activeSlot?' active':'');
    div.innerHTML=`
      <input class="slot-name-input" type="text" value="${esc(s.name)}" placeholder="存檔名稱" data-slot="${i}" ${i!==activeSlot?'readonly':''}/>
      <div class="slot-meta">${s.savedAt?'上次儲存 '+s.savedAt:'尚未儲存'}</div>
      <div class="slot-actions">
        ${i!==activeSlot?`<button class="slot-btn" data-load="${i}">載入</button>`:'<span style="font-size:10px;color:#378ADD;font-weight:500">使用中</span>'}
        <button class="slot-btn danger" data-clear="${i}">清除</button>
      </div>`;
    el.appendChild(div);
  });
  el.querySelectorAll('.slot-name-input').forEach(inp=>{
    inp.addEventListener('input',e=>{
      slots[+e.target.dataset.slot].name=e.target.value;
      try{localStorage.setItem(LS_KEY,JSON.stringify(slots));}catch(e){}
    });
    inp.addEventListener('click',e=>{
      const i=+e.target.dataset.slot;
      if(i!==activeSlot) loadSlot(i);
    });
  });
  el.querySelectorAll('button[data-load]').forEach(btn=>{
    btn.addEventListener('click',()=>loadSlot(+btn.dataset.load));
  });
  el.querySelectorAll('button[data-clear]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=+btn.dataset.clear;
      if(!confirm(`確定要清除「${slots[i].name}」嗎？此存檔的所有資料將被清空，無法復原。`)) return;
      slots[i]={...defaultSlot(i),name:slots[i].name,savedAt:null};
      try{localStorage.setItem(LS_KEY,JSON.stringify(slots));}catch(e){}
      if(i===activeSlot) loadSlot(i);
      else renderSlots();
      showToast('🗑 已清除存檔');
    });
  });
}

/* ── HELPERS ── */
const fmt=n=>'NT$'+Math.round(n).toLocaleString();
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const income=()=>parseFloat(document.getElementById('income').value)||0;
const catBudget=c=>income()*c.pct/100;
const catSpent=c=>c.items.reduce((a,i)=>a+(parseFloat(i.amount)||0),0);

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function setSliderFill(slider,color){
  const pct=parseInt(slider.value);
  slider.style.background=`linear-gradient(to right,${color} 0%,${color} ${pct}%,#e8e8e5 ${pct}%,#e8e8e5 100%)`;
}

/* 一鍵歸位：固定最後調整過的 bar，剩餘平均分配給另外兩個 */
function normalizePcts(){
  const total=CATS.reduce((a,c)=>a+c.pct,0);
  if(total===100) return;
  let lockIdx=(lastAdjustedCI===null||lastAdjustedCI===undefined)?0:lastAdjustedCI;
  let locked=Math.min(100,Math.max(0,CATS[lockIdx].pct));
  CATS[lockIdx].pct=locked;
  const remaining=100-locked;
  const others=[0,1,2].filter(i=>i!==lockIdx);
  const half=Math.floor(remaining/2);
  CATS[others[0]].pct=half;
  CATS[others[1]].pct=remaining-half;
  render();
}

/* ── SUMMARY UPDATE (no DOM rebuild) ── */
function updateSummary(){
  const inc=income();
  let total=0; CATS.forEach(c=>total+=catSpent(c));
  const left=inc-total;
  const totalPct=CATS.reduce((a,c)=>a+c.pct,0);

  document.getElementById('s-inc').textContent=fmt(inc);
  document.getElementById('s-spend').textContent=fmt(total);
  const lEl=document.getElementById('s-left');
  lEl.textContent=fmt(left);
  lEl.style.color=left<0?'#e24b4a':'#1a1a1a';
  document.getElementById('s-left-sub').textContent=inc?Math.round(left/inc*100)+'%':'—';
  ['n','w','s'].forEach((id,i)=>{document.getElementById('bar-'+id).style.width=CATS[i].pct+'%';});

  const wEl=document.getElementById('warn');
  if(totalPct!==100){wEl.style.display='flex';document.getElementById('warn-val').textContent=totalPct;}
  else wEl.style.display='none';

  CATS.forEach((cat,ci)=>{
    const card=document.getElementById('cat-card-'+ci);
    if(!card) return;
    const budget=catBudget(cat),spent=catSpent(cat),over=spent>budget;
    const pctUsed=budget>0?Math.min(spent/budget*100,100):0;
    const tag=card.querySelector('.status-tag');
    tag.className='status-tag '+(over?'over-tag':'ok-tag');
    tag.textContent=over?'超支':'尚可';
    card.querySelector('.pct-badge').textContent=cat.pct+'%';
    const sl=card.querySelector('input[type=range]');
    if(sl){sl.value=cat.pct;setSliderFill(sl,cat.color);}
    card.querySelector('.pct-num').textContent=cat.pct+'%';
    const bB=card.querySelector('.b-budget'),bS=card.querySelector('.b-spent'),bL=card.querySelector('.b-left');
    if(bB) bB.textContent=fmt(budget);
    if(bS){bS.textContent=fmt(spent);bS.style.color=over?'#e24b4a':cat.color;}
    if(bL) bL.textContent='剩餘 '+fmt(budget-spent);
    const pf=card.querySelector('.progress-fill');
    if(pf){pf.style.width=pctUsed+'%';pf.style.background=over?'#e24b4a':cat.color;}
  });

  scheduleSave();
}

function render(){updateSummary();renderCats();}

function renderCats(){
  // 重建前先銷毀舊的 Sortable 實例，避免記憶體洩漏與重複綁定
  sortables.forEach(s=>{try{s.destroy();}catch(e){}});
  sortables=[];

  const el=document.getElementById('cats');
  el.innerHTML='';
  CATS.forEach((cat,ci)=>{
    const budget=catBudget(cat),spent=catSpent(cat),over=spent>budget;
    const pctUsed=budget>0?Math.min(spent/budget*100,100):0;
    const card=document.createElement('div');
    card.className='cat-card'; card.id='cat-card-'+ci;
    card.innerHTML=`
      <div class="cat-head">
        <span class="dot" style="background:${cat.color}"></span>
        <span class="cat-name">${cat.label}</span>
        <span class="pct-badge" style="background:${cat.color}">${cat.pct}%</span>
        <span class="status-tag ${over?'over-tag':'ok-tag'}">${over?'超支':'尚可'}</span>
      </div>
      <div class="cat-sub">${cat.sub}</div>
      <div class="slider-wrap" style="--ac:${cat.color}">
        <input type="range" min="0" max="100" step="1" value="${cat.pct}" data-ci="${ci}">
        <span class="pct-num">${cat.pct}%</span>
      </div>
      <div class="budget-row">
        <span>預算 <strong class="b-budget">${fmt(budget)}</strong></span>
        <span>支出 <strong class="b-spent" style="color:${over?'#e24b4a':cat.color}">${fmt(spent)}</strong></span>
        <span class="b-left">剩餘 ${fmt(budget-spent)}</span>
      </div>
      <div class="progress-bg"><div class="progress-fill" style="width:${pctUsed}%;background:${over?'#e24b4a':cat.color}"></div></div>
      <div class="items" data-ci="${ci}">
        ${cat.items.map((item,ii)=>`
          <div class="item-row">
            <span class="drag-handle" title="拖曳排序">≡</span>
            <input type="text" value="${esc(item.title||'')}" placeholder="說明／標題" data-ci="${ci}" data-ii="${ii}" data-f="title">
            <input type="number" value="${item.amount||''}" placeholder="金額" min="0" step="100" data-ci="${ci}" data-ii="${ii}" data-f="amount">
            <button class="del-btn" data-del="${ci}-${ii}" title="刪除">✕</button>
          </div>`).join('')}
      </div>
      <button class="add-btn" data-add="${ci}">＋ 新增項目</button>`;
    el.appendChild(card);
    setSliderFill(card.querySelector('input[type=range]'),cat.color);

    // 初始化此分類的拖曳排序（不設 group → 鎖死在分類內，無法跨類）
    const itemsEl=card.querySelector('.items');
    if(typeof Sortable!=='undefined'){
      sortables.push(Sortable.create(itemsEl,{
        handle:'.drag-handle',
        animation:150,
        ghostClass:'sortable-ghost',
        chosenClass:'sortable-chosen',
        dragClass:'sortable-drag',
        onEnd:function(evt){
          if(evt.oldIndex===evt.newIndex) return;
          const arr=CATS[ci].items;
          const [moved]=arr.splice(evt.oldIndex,1);
          arr.splice(evt.newIndex,0,moved);
          render();
          scheduleSave();
        }
      }));
    }
  });
  attachEvents();
}

function attachEvents(){
  const el=document.getElementById('cats');
  el.querySelectorAll('input[type=range]').forEach(r=>{
    r.addEventListener('input',e=>{
      lastAdjustedCI=+e.target.dataset.ci;
      CATS[+e.target.dataset.ci].pct=parseInt(e.target.value);
      setSliderFill(e.target,CATS[+e.target.dataset.ci].color);
      updateSummary();
    });
  });
  el.querySelectorAll('input[data-f]').forEach(inp=>{
    inp.addEventListener('input',e=>{
      CATS[+e.target.dataset.ci].items[+e.target.dataset.ii][e.target.dataset.f]=e.target.value;
      updateSummary();
    });
  });
  el.querySelectorAll('button[data-del]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const[ci,ii]=btn.dataset.del.split('-').map(Number);
      CATS[ci].items.splice(ii,1); render();
    });
  });
  el.querySelectorAll('button[data-add]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      CATS[+btn.dataset.add].items.push({title:'',amount:''}); render();
    });
  });
}

/* ── EXPORT CSV ── */
document.getElementById('exportBtn').addEventListener('click',()=>{
  const inc=income();
  const rows=[['50/30/20 收支分析表'],['月收入',inc],[],['類別','比例(%)','預算(NT$)','說明','金額(NT$)']];
  CATS.forEach(cat=>{
    const budget=catBudget(cat);
    if(!cat.items.length){rows.push([cat.label,cat.pct,Math.round(budget),'','']);}
    else cat.items.forEach((item,i)=>rows.push([i===0?cat.label:'',i===0?cat.pct:'',i===0?Math.round(budget):'',item.title||'',parseFloat(item.amount)||0]));
  });
  rows.push([],['[摘要]','','','總支出',Math.round(CATS.reduce((a,c)=>a+catSpent(c),0))]);
  rows.push(['[摘要]','','','結餘',Math.round(inc-CATS.reduce((a,c)=>a+catSpent(c),0))]);
  const csv=rows.map(r=>r.map(v=>{const s=String(v);return(s.includes(',')||s.includes('"'))?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\r\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  const now=new Date(),ds=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  let slotName=(slots[activeSlot].name||'').trim().replace(/[\/\\:*?"<>|]/g,'_');
  if(!slotName) slotName='BudgetSplit';
  a.download=`${slotName}_${ds}.csv`;a.click();URL.revokeObjectURL(url);
  showToast('✅ 已匯出 CSV');
});

/* ── IMPORT CSV ── */
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=evt=>{
    try{
      let text=evt.target.result;
      if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
      const lines=text.split(/\r?\n/).map(parseCSVLine);
      const catMap={'必要支出':0,'想要支出':1,'儲蓄與投資':2};
      const SKIP=['總支出','結餘','說明'];
      let inc=0,lastCI=undefined;
      const newPcts=[50,30,20],newItems=[[],[],[]];
      lines.forEach(cols=>{
        if(!cols||cols.length<2)return;
        if(cols[0]==='月收入'){inc=parseFloat(cols[1])||0;return;}
        if(catMap[cols[0]]!==undefined){lastCI=catMap[cols[0]];if(cols[1]!=='')newPcts[lastCI]=parseFloat(cols[1])||newPcts[lastCI];}
        if(cols[0]==='[摘要]'||SKIP.includes(cols[3]))return;
        if(lastCI!==undefined&&cols.length>=5&&(cols[3]!==''||cols[4]!==''))newItems[lastCI].push({title:cols[3],amount:cols[4]||''});
      });
      if(inc)document.getElementById('income').value=inc;
      CATS.forEach((cat,ci)=>{cat.pct=newPcts[ci];cat.items=newItems[ci];});
      let baseName=file.name.replace(/\.csv$/i,'').replace(/_\d{8}$/,'').trim();
      if(baseName){
        slots[activeSlot].name=baseName;
        try{localStorage.setItem(LS_KEY,JSON.stringify(slots));}catch(e){}
      }
      lastAdjustedCI=null;
      render();
      renderSlots();
      showToast('✅ 匯入成功');
    }catch(err){showToast('❌ 匯入失敗，請確認 CSV 格式');}
    e.target.value='';
  };
  reader.readAsText(file,'UTF-8');
});

function parseCSVLine(line){
  const res=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(c===','&&!inQ){res.push(cur.trim());cur='';}
    else cur+=c;
  }
  res.push(cur.trim());return res;
}

/* ── SNAPSHOT (Canvas 自繪 PNG，非截圖現有 UI) ── */
function exportSnapshot(){
  const inc=income();
  const slotName=(slots[activeSlot].name||'BudgetSplit').trim();
  const dateStr=new Date().toLocaleDateString('zh-TW');
  const scale=2, W=600, padX=36;

  const measureCtx=document.createElement('canvas').getContext('2d');
  const H=paint(measureCtx,false,0);

  const canvas=document.createElement('canvas');
  canvas.width=W*scale; canvas.height=Math.round(H*scale);
  const ctx=canvas.getContext('2d');
  ctx.scale(scale,scale);
  paint(ctx,true,H);

  canvas.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url;
    const now=new Date(), ds=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
    let clean=slotName.replace(/[\/\\:*?"<>|]/g,'_')||'BudgetSplit';
    a.download=`${clean}_快照_${ds}.png`;
    a.click(); URL.revokeObjectURL(url);
    showToast('📸 已輸出快照');
  },'image/png');

  function paint(ctx,draw,Htotal){
    ctx.textBaseline='middle';
    if(draw){ ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,Htotal); }
    const fit=(text,maxW)=>{
      if(ctx.measureText(text).width<=maxW) return text;
      let t=text;
      while(t.length>1 && ctx.measureText(t+'…').width>maxW) t=t.slice(0,-1);
      return t+'…';
    };
    let y=48;

    // 標題 + 日期
    ctx.textAlign='left';
    ctx.font='700 24px system-ui,-apple-system,sans-serif';
    if(draw){ ctx.fillStyle='#111'; ctx.fillText(fit(slotName,W-padX*2-170),padX,y); }
    ctx.textAlign='right';
    ctx.font='400 13px system-ui,sans-serif';
    if(draw){ ctx.fillStyle='#aaa'; ctx.fillText('BudgetSplit · '+dateStr,W-padX,y); }
    y+=30;

    ctx.textAlign='left';
    ctx.font='400 13px system-ui,sans-serif';
    if(draw){ ctx.fillStyle='#888'; ctx.fillText('50 / 30 / 20 資產配置快照',padX,y); }
    y+=26;

    if(draw){ ctx.strokeStyle='#eeeeec'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(padX,y); ctx.lineTo(W-padX,y); ctx.stroke(); }
    y+=28;

    // 月收入
    ctx.textAlign='left';
    ctx.font='400 14px system-ui,sans-serif';
    if(draw){ ctx.fillStyle='#666'; ctx.fillText('月收入',padX,y); }
    ctx.textAlign='right';
    ctx.font='700 18px system-ui,sans-serif';
    if(draw){ ctx.fillStyle='#111'; ctx.fillText(fmt(inc),W-padX,y); }
    y+=30;

    // 堆疊 bar
    const barW=W-padX*2, barH=16, barTop=y;
    if(draw){
      ctx.save();
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(padX,barTop,barW,barH,8); else ctx.rect(padX,barTop,barW,barH);
      ctx.clip();
      ctx.fillStyle='#eeeeec'; ctx.fillRect(padX,barTop,barW,barH);
      let sx=padX;
      CATS.forEach(c=>{
        const w=barW*(Math.max(0,c.pct)/100);
        ctx.fillStyle=c.color; ctx.fillRect(sx,barTop,w,barH); sx+=w;
      });
      ctx.restore();
    }
    y+=barH+30;

    // 各分類
    CATS.forEach(c=>{
      const budget=inc*c.pct/100, spent=catSpent(c), over=spent>budget;
      if(draw){
        ctx.fillStyle=c.color;
        ctx.beginPath(); ctx.arc(padX+5,y,5,0,Math.PI*2); ctx.fill();
        ctx.textAlign='left';
        ctx.font='600 15px system-ui,sans-serif'; ctx.fillStyle='#111';
        ctx.fillText(c.label,padX+18,y);
        const nameW=ctx.measureText(c.label).width;
        ctx.font='600 13px system-ui,sans-serif'; ctx.fillStyle=c.color;
        ctx.fillText('  '+c.pct+'%',padX+18+nameW,y);
        ctx.textAlign='right';
        ctx.font='400 12px system-ui,sans-serif';
        ctx.fillStyle=over?'#e24b4a':'#777';
        ctx.fillText('預算 '+fmt(budget)+' · 支出 '+fmt(spent),W-padX,y);
      }
      y+=30;
      if(c.items.length===0){
        if(draw){ ctx.textAlign='left'; ctx.font='400 13px system-ui,sans-serif'; ctx.fillStyle='#bbb'; ctx.fillText('（尚無項目）',padX+18,y); }
        y+=28;
      } else {
        c.items.forEach(it=>{
          if(draw){
            ctx.textAlign='left'; ctx.font='400 13px system-ui,sans-serif'; ctx.fillStyle='#444';
            ctx.fillText(fit(it.title||'（未命名）',barW-150),padX+18,y);
            ctx.textAlign='right'; ctx.font='500 13px system-ui,sans-serif'; ctx.fillStyle='#222';
            ctx.fillText(fmt(parseFloat(it.amount)||0),W-padX,y);
          }
          y+=28;
        });
      }
      y+=8;
      if(draw){ ctx.strokeStyle='#f2f1ef'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(padX,y); ctx.lineTo(W-padX,y); ctx.stroke(); }
      y+=12;
    });

    // footer 總計
    y+=6;
    const totalSpent=CATS.reduce((a,c)=>a+catSpent(c),0), balance=inc-totalSpent;
    if(draw){
      ctx.textAlign='left'; ctx.font='600 14px system-ui,sans-serif'; ctx.fillStyle='#555'; ctx.fillText('總支出',padX,y);
      ctx.textAlign='right'; ctx.font='700 16px system-ui,sans-serif'; ctx.fillStyle='#111'; ctx.fillText(fmt(totalSpent),W-padX,y);
    }
    y+=30;
    if(draw){
      ctx.textAlign='left'; ctx.font='600 14px system-ui,sans-serif'; ctx.fillStyle='#555'; ctx.fillText('結餘',padX,y);
      ctx.textAlign='right'; ctx.font='700 18px system-ui,sans-serif'; ctx.fillStyle=balance<0?'#e24b4a':'#1D9E75'; ctx.fillText(fmt(balance),W-padX,y);
    }
    y+=28;

    return y+24;
  }
}
document.getElementById('snapshotBtn').addEventListener('click',exportSnapshot);

</script>
